plugins {
    id 'java-gradle-plugin'
}

repositories {
    if (System.getenv('CI') == null && System.getenv('GITHUB_ACTIONS') == null) {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
    }
    google()
    mavenCentral()
}

configurations {
    captureDependency
}

dependencies {
    implementation 'com.android.tools.build:gradle-api:8.12.0'
    implementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'junit:junit:4.13.2'
    captureDependency('org.jitsi:webrtc:124.0.0') { transitive = false }
}

gradlePlugin {
    plugins {
        coveAndroidInstrumentation {
            id = 'com.cove.android-instrumentation'
            implementationClass = 'com.cove.instrumentation.CoveAndroidInstrumentationPlugin'
        }
    }
}

tasks.named('test') {
    useJUnit()
    doFirst {
        systemProperty 'cove.webrtc.aar', configurations.captureDependency.singleFile.absolutePath
        systemProperty 'cove.rnwebrtc.jar', file('../../node_modules/react-native-webrtc/android/build/intermediates/compile_library_classes_jar/debug/bundleLibCompileToJarDebug/classes.jar').absolutePath
    }
}

name: Release Cove Mobile

on:
  push:
    tags:
      - 'mobile-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的手机 Release 标签，例如 mobile-v0.5.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-mobile:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Validate mobile tag and version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mobile release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#mobile-v}"
          package_version=$(node -p "require('./mobile/package.json').version")
          gradle_version=$(grep -oE 'versionName "[0-9]+\.[0-9]+\.[0-9]+"' mobile/android/app/build.gradle | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          if [[ "$package_version" != "$version" || "$gradle_version" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match mobile versions: package=$package_version gradle=$gradle_version" >&2
            exit 1
          fi

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Test mobile client
        working-directory: mobile
        run: |
          npm test -- --runInBand
          npm run typecheck
          npm run lint

      - name: Build ARM release APK
        working-directory: mobile
        run: npm run android:apk -- "-PreactNativeArchitectures=armeabi-v7a,arm64-v8a"

      - name: Prepare release metadata
        working-directory: mobile
        run: npm run update:prepare -- RELEASE_NOTES.md "$RELEASE_TAG"

      - name: Create or update GitHub Release
        working-directory: mobile
        shell: bash
        run: |
          version="${RELEASE_TAG#mobile-v}"
          apk="build/updates/$RELEASE_TAG/Cove-Mobile-$version.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Missing release APK: $apk" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --title "cove mobile $version" \
              --notes-file RELEASE_NOTES.md \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$apk" \
              --verify-tag \
              --title "cove mobile $version" \
              --notes-file RELEASE_NOTES.md \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify published release asset
        shell: bash
        run: |
          version="${RELEASE_TAG#mobile-v}"
          asset="Cove-Mobile-$version.apk"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets \
            --jq "if .isDraft or .isPrerelease then error(\"Release is not public\") else ([.assets[].name] | index(\"$asset\")) end" \
            | grep -qx '0'

name: Release Cove Client

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches client version
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $serverVersion = node -p "require('./apps/server/package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match client version $version"
          }
          if ($serverVersion -ne $version) {
            throw "Server version $serverVersion does not match client version $version"
          }
          if (-not (Select-String -Path RELEASE_NOTES.md -SimpleMatch "Cove v$version" -Quiet)) {
            throw "RELEASE_NOTES.md does not describe Cove v$version"
          }

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com && npm run build:packages

      - name: Verify architecture and development startup contracts
        run: node --test tests/architecture.test.cjs tests/dev-startup.test.cjs

      - name: Test desktop client
        run: npm test -w cove-client

      - name: Test release mirror asset selection without network access
        shell: pwsh
        run: ./apps/desktop/tests/publish-release-mirror.test.ps1

      - name: Test server
        run: npm test -w cove-server

      - name: Build Windows release
        run: npm run build:electron -w cove-client -- --win --x64 --publish never --config.electronDist=node_modules/electron/dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare server Visual C++ runtime
        shell: pwsh
        run: |
          $runtime = "apps/server/build/vc_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $runtime
          $signature = Get-AuthenticodeSignature -FilePath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "Visual C++ runtime signature validation failed"
          }

      - name: Build Windows server release
        run: npm run build:electron -w cove-server -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $installer = "apps/desktop/dist-app/Cove-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $manifest = "apps/desktop/dist-app/latest.yml"
          $integrityManifest = "apps/desktop/dist-app/Cove-Integrity-$version-win32-x64.json"
          $serverInstaller = "apps/server/dist-app/Cove-Server-Setup-$version.exe"
          $serverBlockmap = "$serverInstaller.blockmap"

          foreach ($asset in @($installer, $blockmap, $manifest, $serverInstaller, $serverBlockmap, $integrityManifest)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
            if ((Get-Item -LiteralPath $asset).Length -gt 120MB) {
              throw "Release asset exceeds the 120 MiB safety limit: $asset"
            }
          }

          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $repo `
              --verify-tag `
              --draft `
              --title "Cove v$version" `
              --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Creating the draft release failed" }
          }

          gh release upload $tag $installer $blockmap $manifest $serverInstaller $serverBlockmap $integrityManifest --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Uploading release assets failed" }
          # The checker authenticates the manifest with this official HTTPS API
          # asset digest, never with a checksum downloaded beside the manifest.
          # Draft releases may not resolve through REST's tag endpoint. The CLI
          # resolves the draft and exposes its exact release-ID API URL instead.
          $draftDetails = gh release view $tag --repo $repo --json apiUrl | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $draftDetails.apiUrl -notmatch "^https://api\.github\.com/repos/$([regex]::Escape($repo))/releases/\d+$") {
            throw "Resolving the exact draft release API URL failed"
          }
          $releaseApi = gh api $draftDetails.apiUrl | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Reading official release asset digests failed" }
          $integrityName = Split-Path $integrityManifest -Leaf
          $integrityAsset = @($releaseApi.assets | Where-Object name -ceq $integrityName)
          $integrityDigest = 'sha256:' + (Get-FileHash -LiteralPath $integrityManifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($integrityAsset.Count -ne 1 -or $integrityAsset[0].digest -cne $integrityDigest) {
            throw "Official GitHub API integrity manifest digest does not match the release file"
          }
          $verifyAssets = Join-Path $env:RUNNER_TEMP ("cove-release-verify-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $verifyAssets | Out-Null
          foreach ($asset in @($installer, $blockmap, $manifest, $serverInstaller, $serverBlockmap, $integrityManifest)) {
            New-Item -ItemType HardLink -Path (Join-Path $verifyAssets (Split-Path $asset -Leaf)) -Target (Resolve-Path $asset).Path | Out-Null
          }
          [IO.File]::WriteAllText((Join-Path $verifyAssets 'release.json'), ($releaseApi | ConvertTo-Json -Depth 30), [Text.UTF8Encoding]::new($false))
          node tools/verify-release-integrity.cjs $verifyAssets --allow-draft
          if ($LASTEXITCODE -ne 0) { throw "Actual installer payload does not match the official inventory" }
          gh release edit $tag --draft=false --latest --title "Cove v$version" --notes-file RELEASE_NOTES.md --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "Publishing release failed" }

          $published = gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.isPrerelease -or $published.tagName -ne $tag) {
            throw "Release is not publicly published with the expected tag"
          }
          foreach ($asset in @($installer, $blockmap, $manifest, $serverInstaller, $serverBlockmap, $integrityManifest)) {
            $name = Split-Path $asset -Leaf
            $remote = @($published.assets | Where-Object name -eq $name)
            if ($remote.Count -ne 1 -or $remote[0].size -ne (Get-Item -LiteralPath $asset).Length) {
              throw "Published release asset is missing or has the wrong size: $name"
            }
          }
          Write-Output "Verified public GitHub Release: $($published.url)"

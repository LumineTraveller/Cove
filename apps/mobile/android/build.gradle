buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    // Aliyun mirrors are for local acceleration in China only. Overseas CI
    // (GitHub Actions) often gets 502 from them, and Gradle treats repo 5xx
    // responses as resolution failures, so skip mirrors in CI environments.
    def inCi = System.getenv('CI') != null || System.getenv('GITHUB_ACTIONS') != null
    repositories {
        if (!inCi) {
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/central" }
            maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// buildscript and root scopes are independent; declare the CI check for each.
def inCiRoot = System.getenv('CI') != null || System.getenv('GITHUB_ACTIONS') != null

allprojects {
    repositories {
        if (!inCiRoot) {
            maven { url "https://maven.aliyun.com/repository/google" }
            maven { url "https://maven.aliyun.com/repository/central" }
        }
        google()
        mavenCentral()
    }
}

apply plugin: "com.facebook.react.rootproject"
